name: Setup Packit
description: Sets up a full Packit installation

inputs:
  version:
    description: The version of Packit to install
    required: true
  revision:
    description: The revision version of Packit to install
    required: false
    default: 0
  repository-url:
    description: The url of the metadata repository to set in the Packit config
    required: false
  repository-provider:
    description: The provider of the metadata repository to set in the Packit config
    required: false

runs:
  using: node24
  main: main.mts
